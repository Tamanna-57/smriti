services:
  - type: web
    name: smriti-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Reminder times in seed.js are built in server time; Render runs in UTC.
      - key: TZ
        value: Asia/Kolkata
      # Hosted demo: seed when empty and refresh demo reminders daily (wipes the DB!)
      - key: DEMO_SEED
        value: daily
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MY_WHATSAPP_NUMBER
        sync: false
